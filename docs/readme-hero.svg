<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071019"/>
      <stop offset="55%" stop-color="#0b2a28"/>
      <stop offset="100%" stop-color="#0f3d38"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow1)"/>
  <circle cx="1020" cy="80" r="220" fill="url(#glow2)"/>

  <g opacity="0.08" stroke="#5eead4" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <g transform="translate(150,160)">
    <circle r="78" fill="#020617" opacity="0.4" filter="url(#soft)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      <path d="M0,-58 L14,-50 L14,-31 L31,-14 L50,-14 L58,0 L50,14 L31,14 L14,31 L14,50 L0,58 L-14,50 L-14,31 L-31,14 L-50,14 L-58,0 L-50,-14 L-31,-14 L-14,-31 L-14,-50 Z"
            fill="url(#gear)"/>
      <circle r="21" fill="#071019"/>
      <circle r="21" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
    </g>
  </g>

  <g font-family="Verdana, Arial, sans-serif">
    <rect x="310" y="76" width="260" height="78" rx="14" fill="url(#card)" opacity="0"
          style="filter:drop-shadow(0 8px 18px rgba(13,148,136,0.35))">
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="332" y="108" fill="#f0fdfa" font-size="17" font-weight="bold" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" begin="0s" repeatCount="indefinite"/>
      Requested
    </text>
    <text x="332" y="133" fill="#ccfbf1" font-size="12.5" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" begin="0s" repeatCount="indefinite"/>
      AC Gas Refill, Dhanmondi
    </text>

    <rect x="310" y="76" width="260" height="78" rx="14" fill="url(#card)" opacity="0"
          style="filter:drop-shadow(0 8px 18px rgba(13,148,136,0.35))">
      <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="332" y="108" fill="#f0fdfa" font-size="17" font-weight="bold" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" begin="2s" repeatCount="indefinite"/>
      In Progress
    </text>
    <text x="332" y="133" fill="#ccfbf1" font-size="12.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" begin="2s" repeatCount="indefinite"/>
      Laptop Keyboard Repair
    </text>

    <rect x="310" y="76" width="260" height="78" rx="14" fill="url(#card)" opacity="0"
          style="filter:drop-shadow(0 8px 18px rgba(13,148,136,0.35))">
      <animate attributeName="opacity" values="0;0;0;1;1" dur="6s" begin="4s" repeatCount="indefinite"/>
    </rect>
    <text x="332" y="108" fill="#f0fdfa" font-size="17" font-weight="bold" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1" dur="6s" begin="4s" repeatCount="indefinite"/>
      Paid
    </text>
    <text x="332" y="133" fill="#ccfbf1" font-size="12.5" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1" dur="6s" begin="4s" repeatCount="indefinite"/>
      $45.00, Stripe checkout
    </text>
  </g>

  <g font-family="Verdana, Arial, sans-serif">
    <text x="440" y="222" fill="#5eead4" font-size="13" letter-spacing="3" font-weight="bold">FIXMATE API</text>
    <text x="440" y="258" fill="#f8fafc" font-size="36" font-weight="bold">Book it. Fix it. Pay it.</text>
  </g>

  <g transform="translate(980,170)">
    <rect x="-95" y="-92" width="190" height="184" rx="20" fill="#061b1a" stroke="#14b8a6" stroke-width="2"
          style="filter:drop-shadow(0 12px 24px rgba(0,0,0,0.4))"/>
    <circle cx="0" cy="-30" r="30" fill="#2dd4bf"/>
    <path d="M-38,66 C-38,14 38,14 38,66 Z" fill="#0d9488"/>

    <g>
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
      <circle cx="48" cy="-62" r="22" fill="#fbbf24"/>
      <path d="M38,-62 l7,8 l16,-18" stroke="#071019" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="0" y="104" fill="#99f6e4" font-size="13" text-anchor="middle" font-family="Verdana, Arial, sans-serif">
      Verified Technician
    </text>
  </g>

  <g transform="translate(80,270)" opacity="0.5">
    <circle r="3" fill="#5eead4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(1140,60)" opacity="0.5">
    <circle r="3" fill="#fbbf24">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
